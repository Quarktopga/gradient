/* ---------- Prix et diffusion ---------- */
SCREENS.market = function () {
  const cur = { price: S.price, diff: S.diff };
  const mk = planned(S, 'mkt');
  const door = (id, ic, txt) => {
    const lk = (S.diff === 'open' && id === 'closed') || (id === 'open' && hasContract(S, 'ms'));
    return `<button class="door ${U.selDiff === id ? 'sel' : ''} ${lk ? 'lk' : ''}" data-a="selDiff" data-v="${id}" aria-pressed="${U.selDiff === id}">${ico(ic, 28, id === 'open' ? '#39c18a' : '#ff9f1c')}<b>${DIFFS[id].name}</b><span style="font-size:12px;font-weight:700;line-height:1.2">${txt}</span>${S.diff === id ? '<span class="pill" style="align-self:flex-start;background:var(--ink);color:var(--yel)">En place</span>' : lk ? '<span class="pill" style="align-self:flex-start">Impossible</span>' : ''}</button>`;
  };
  const rows = PRICES.map(p => `<button class="prow ${U.selPrice === p.id ? 'sel' : ''}" data-a="selPrice" data-v="${p.id}" aria-pressed="${U.selPrice === p.id}">
    <span style="display:flex;flex-direction:column;gap:3px"><b>${p.name}</b>${S.price === p.id ? '<span class="pill" style="align-self:flex-start;background:var(--ink);color:var(--yel);font-size:10px;padding:1px 6px">En place</span>' : ''}</span>
    <span class="pb"><span class="pbx"><span>Usage</span>${pips(p.usage, 5)}</span><span class="pbx"><span>Revenus</span>${pips(p.rev, 5)}</span><span class="pbx"><span>Charge</span>${pips(p.charge, 5)}</span></span></button>`).join('');
  const same = U.selPrice === cur.price && U.selDiff === cur.diff;
  const sameAsPlan = mk && mk.p.price === U.selPrice && mk.p.diff === U.selDiff;
  const why = !sameAsPlan ? canPlace(S, 'mkt', { price: U.selPrice, diff: U.selDiff }) : { ok: true };
  let btn;
  if (sameAsPlan) btn = `<button class="btn sec" data-a="confirmMkt">Retirer cette décision<small>équipe rendue</small></button>`;
  else if (same) btn = `<button class="btn off" data-a="x" data-why="Rien ne change par rapport à aujourd’hui.">Déjà en place<small>choisissez autre chose</small></button>`;
  else if (!why.ok && !(mk && why.why === 'Cette équipe est déjà posée ici.')) btn = `<button class="btn off" data-a="x" data-why="${why.why}">Confirmer<small>${why.why}</small></button>`;
  else btn = `<button class="btn" data-a="confirmMkt">Confirmer · ${DIFFS[U.selDiff].short}, ${PRICES.find(x => x.id === U.selPrice).name}<small>${fmt(costOf(S, 'mkt', { price: U.selPrice, diff: U.selDiff }), 0)} M$ · 1 équipe</small></button>`;
  const tipTxt = U.tipK === 'diff' ? DIFFS[U.selDiff].tip : PRICES.find(x => x.id === U.selPrice).tip;
  const tipTitle = U.tipK === 'diff' ? (U.selDiff === 'open' ? 'Savoir · Poids ouverts' : 'Savoir · Modèle fermé') : 'Savoir · ' + PRICES.find(x => x.id === U.selPrice).name;
  return `${barHTML('Prix et diffusion', 'Année ' + S.year + ' · Marché')}
  <div class="scroll">
    <div class="lbl">Diffusion du modèle</div>
    <div class="doors">${door('closed', 'lock', 'Le modèle reste chez vous. Vous faites payer l’accès.')}${door('open', 'unlock', 'Tout le monde peut le télécharger. Irréversible.')}</div>
    <div class="lbl">Prix de l’offre</div>
    ${rows}
    <div class="sav"><span class="cap">${tipTitle}</span><span>${tipTxt}</span></div>
  </div>
  <div class="foot">${btn}</div>`;
};

/* ---------- Produits ---------- */
SCREENS.prod = function () {
  const pos = { chat: [141, 4], images: [24, 84], voice: [262, 84], code: [212, 240], agents: [70, 240] };
  const cname = S.tier ? SIZES[S.tier - 1].name : 'Aucun';
  const piece = id => {
    const pd = PRODUCTS[id], on = S.products[id], pl = planned(S, 'prod:' + id);
    const miss = id === 'chat' ? (S.tier ? null : { t: 'Un modèle' }) : pd.req.find(r => !r.f(S));
    const cls = on || pl ? '' : miss ? 'lk' : 'av';
    const bg = on || pl ? `background:${pd.col}` : '';
    const sub = on ? 'En ligne' : pl ? 'Prévu' : miss ? 'Verrouillé' : 'Disponible';
    return `<button class="piece ${cls} ${U.selProd === id ? 'sel' : ''}" style="left:${pos[id][0]}px;top:${pos[id][1]}px;${bg}" data-a="selProd" data-v="${id}" aria-pressed="${U.selProd === id}">${ico(pd.icon, 26, on || pl ? '#fff' : pd.col)}<b>${pd.name}</b><small>${sub}</small>${pl ? `<span style="position:absolute;right:-8px;top:-10px">${meeple('#9d8cff', 22)}</span>` : ''}</button>`;
  };
  const id = U.selProd, pd = PRODUCTS[id], on = S.products[id], pl = planned(S, 'prod:' + id);
  const reqs = id === 'chat' ? [] : pd.req;
  const chips = reqs.map(r => `<span class="chip ${r.f(S) ? 'ok' : 'no'}">${r.t} · ${r.f(S) ? 'ok' : 'il manque'}</span>`).join('');
  let btn;
  if (id === 'chat') btn = `<button class="btn off" data-a="x" data-why="Le chat s’ouvre tout seul avec votre premier modèle.">Chat<small>${S.products.chat ? 'déjà en ligne' : 'avec votre premier modèle'}</small></button>`;
  else if (on) btn = `<button class="btn off" data-a="x" data-why="Ce produit est déjà en ligne.">${pd.name} en ligne<small>rien à faire</small></button>`;
  else if (pl) btn = `<button class="btn sec" data-a="launchProd">Retirer le lancement<small>équipe rendue</small></button>`;
  else {
    const r = canPlace(S, 'prod:' + id);
    btn = r.ok ? `<button class="btn" data-a="launchProd">Lancer ${pd.name.toLowerCase()} · ${fmt(costOf(S, 'prod:' + id), 0)} M$<small>1 équipe</small></button>` : `<button class="btn off" data-a="x" data-why="${r.why}">Lancer ${pd.name.toLowerCase()}<small>${r.why}</small></button>`;
  }
  return `${barHTML('Produits autour du modèle', 'Année ' + S.year + ' · Marché')}
  <div class="scroll">
    <div class="hexa">
      <svg style="position:absolute;inset:0" width="358" height="322" viewBox="0 0 358 322" aria-hidden="true">
        <path d="M179 160L179 50M179 160L293 122M179 160L250 258M179 160L108 258M179 160L65 122" stroke="#f2f0fa" stroke-width="2.500" stroke-dasharray="3 6" stroke-linecap="round" fill="none" opacity=".7"/>
        <path d="M179 100l45 26v52l-45 26-45-26v-52z" fill="#9d8cff" stroke="${INK}" stroke-width="3.500" stroke-linejoin="round"/>
        <text x="179" y="153" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="15" fill="${INK}">Modèle</text>
        <text x="179" y="174" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="19" fill="${INK}">${cname}</text>
        <text x="179" y="192" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-weight="700" font-size="11" fill="${INK}">${S.tier ? S.seals + ' sceau' + (S.seals > 1 ? 'x' : '') : 'à venir'}</text>
      </svg>${PROD_ORDER.map(piece).join('')}
    </div>
    <div class="paper" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span class="d" style="font-size:22px;line-height:1">${pd.name}</span><span class="pill" style="background:${pd.col}">Produit</span></div>
      <span style="font-size:14px;line-height:1.3;font-weight:700">${pd.desc}</span>
      ${chips ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${chips}</div>` : ''}
      <div class="grid2" style="grid-template-columns:repeat(3,1fr)"><div class="pbx"><span>Usage</span>${pips(pd.u, 5)}</div><div class="pbx"><span>Revenus</span>${pips(pd.r, 5)}</div><div class="pbx"><span>Charge</span>${pips(pd.c, 5)}</div></div>
      <div class="sav" style="box-shadow:none"><span class="cap">${pd.tip.startsWith('Savoir') ? pd.tip.split(' : ')[0] : 'Savoir · ' + pd.name}</span><span>${pd.tip.startsWith('Savoir') ? pd.tip.split(' : ').slice(1).join(' : ').replace(/^./, c => c.toUpperCase()) : pd.tip}</span></div>
    </div>
  </div>
  <div class="foot">${btn}</div>`;
};

/* ---------- Partenaires ---------- */
SCREENS.part = function () {
  const slots = [];
  S.contracts.forEach(c => slots.push(`<div class="slot fill"><span><b class="d" style="font-size:14px">${PARTNERS[c.id].name}</b><br><span style="font-size:11px">${c.left} an${plural(c.left, '', 's')} restant${plural(c.left, '', 's')}</span></span></div>`));
  S.plan.filter(x => x.k.startsWith('part:')).forEach(x => slots.push(`<div class="slot fill" style="background:var(--tint)"><span><b class="d" style="font-size:14px">${PARTNERS[x.k.slice(5)].name}</b><br><span style="font-size:11px">à signer</span></span></div>`));
  while (slots.length < 2) slots.push('<div class="slot">Libre</div>');
  const id = U.selPart, pt = PARTNERS[id], signed = hasContract(S, id), pl = planned(S, 'part:' + id);
  const miss = pt.req.filter(r => !r.f(S));
  const r = canPlace(S, 'part:' + id);
  const col = list => list.map(t => `<span style="font-size:13px;line-height:1.28;font-weight:700">${t}</span>`).join('');
  let btns;
  if (signed) btns = `<button class="btn off" style="flex:1" data-a="x" data-why="Contrat en cours.">Contrat en cours</button>`;
  else if (pl) btns = `<button class="btn sec" style="flex:1" data-a="signPart">Annuler la signature<small>équipe rendue</small></button>`;
  else btns = `<button class="btn sec" style="min-height:46px;flex:none;font-size:14px" data-a="nextPart">Autre</button>` + (r.ok ? `<button class="btn" style="flex:1;min-height:46px;font-size:15px" data-a="signPart">Signer · 1 équipe</button>` : `<button class="btn off" style="flex:1;min-height:46px;font-size:15px" data-a="x" data-why="${r.why}">Signer<small>${r.why.replace('.', '')}</small></button>`);
  const rows = PART_ORDER.filter(x => x !== id).map(x => {
    const p = PARTNERS[x], sg = hasContract(S, x), mq = p.req.find(q => !q.f(S));
    const seals = p.need ? `${Math.min(S.seals, p.need)} sceau${p.need > 1 ? 'x' : ''} sur ${p.need}` : '';
    return `<button class="crow ${mq ? 'lk' : ''}" data-a="selPart" data-v="${x}"><span class="n"><b>${p.name}</b><span>${p.tag}</span></span>${sg ? '<span class="chip ok">Actif</span>' : mq ? `<span class="mini">${ico('lock', 16, '#ffd23f')}${p.need ? seals : mq.t}</span>` : `<span class="chip ok">${p.chips[0]}</span><span class="chip no">${p.chips[1]}</span>`}</button>`;
  }).join('');
  return `${barHTML('Partenaires', 'Année ' + S.year + ' · Marché')}
  <div class="scroll">
    <div class="row" style="align-items:center"><span style="font-size:12.5px;font-weight:700;width:92px;line-height:1.2">Deux emplacements de contrat</span>${slots.join('')}</div>
    <div class="paper" style="overflow:hidden">
      <div class="dots" style="background-color:${pt.col};border-bottom:3px solid var(--ink);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px"><div style="display:flex;flex-direction:column;line-height:1.05"><span class="cap">Contrat</span><span class="d" style="font-size:26px">${pt.name}</span></div><span class="chip">${pt.tag}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr">
        <div style="padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-right:2px solid rgba(27,23,64,.2)"><div class="row" style="align-items:center;gap:6px"><span style="width:20px;height:20px;border-radius:50%;background:var(--grn);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;line-height:1">+</span><b class="d" style="font-size:14px">Vous gagnez</b></div>${col(pt.win)}</div>
        <div style="padding:10px 12px;display:flex;flex-direction:column;gap:6px"><div class="row" style="align-items:center;gap:6px"><span style="width:20px;height:20px;border-radius:50%;background:var(--ora);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;line-height:1">−</span><b class="d" style="font-size:14px">Vous cédez</b></div>${col(pt.lose)}</div>
      </div>
      <div style="border-top:2px solid rgba(27,23,64,.2);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="cap" style="opacity:.65">Durée ${pt.years} ans</span>${pt.req.map(q => `<span class="chip ${q.f(S) ? 'ok' : 'no'}">${q.t}${q.f(S) ? '' : ' · il manque'}</span>`).join('')}</div>
      <div style="border-top:2px solid rgba(27,23,64,.2);padding:10px 12px;display:flex;gap:10px;align-items:center">${btns}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">${rows}</div>
  </div>`;
};

/* ---------- Mon labo ---------- */
SCREENS.labo = function () {
  let mp = '';
  for (let i = 0; i < teamsTotal(S); i++) mp += meeple(i < teamsFree(S) ? '#ffd23f' : '#9d8cff', 30);
  let rooms = '';
  const all = S.rooms + S.rented + msRooms(S);
  for (let i = 0; i < 5; i++) rooms += i < S.rooms ? '<div class="room o"></div>' : i < S.rooms + S.rented ? '<div class="room r"></div>' : i < all ? '<div class="room m"></div>' : '<div class="room e"></div>';
  const seals = Array.from({ length: 3 }, (_, i) => `<span style="width:24px;height:24px;border-radius:50%;border:2px ${i < S.seals ? 'solid' : 'dashed'} var(--ink);background:${i < S.seals ? 'var(--grn)' : 'transparent'};display:grid;place-items:center">${i < S.seals ? '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6l3 3 5-6" fill="none" stroke="#1b1740" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</span>`).join('');
  const prods = PROD_ORDER.map(p => `<span style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center;${S.products[p] ? `background:${PRODUCTS[p].col};border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)` : 'border:2.5px dashed rgba(242,240,250,.5)'}" title="${PRODUCTS[p].name}">${S.products[p] ? ico(PRODUCTS[p].icon, 24, '#fff') : ''}</span>`).join('');
  const ctr = [0, 1].map(i => { const c = S.contracts[i]; return c ? `<span style="flex:1;min-height:46px;border-radius:12px;background:${PARTNERS[c.id].col};border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:13px;color:var(--ink);text-align:center;padding:2px">${PARTNERS[c.id].name}<br><span style="font-family:var(--b);font-size:11px">${c.left} an${plural(c.left, '', 's')}</span></span>` : '<span style="flex:1;min-height:46px;border-radius:12px;border:2.5px dashed rgba(242,240,250,.5);display:grid;place-items:center;font-size:12px;font-weight:700">Libre</span>'; }).join('');
  const fc = fixedCosts(S);
  return `${barHTML('Mon labo', 'Année ' + S.year + ' · Ma réserve')}
  <div class="scroll">
    <div><div class="lbl" style="margin-bottom:6px">Mes équipes · ${teamsTotal(S)} en tout</div><div class="row" style="background:rgba(242,240,250,.1);border:2.5px solid rgba(242,240,250,.4);border-radius:14px;padding:8px 10px;align-items:center;flex-wrap:wrap;gap:4px">${mp}<span style="flex:1;font-size:12px;font-weight:700;min-width:120px">Jaunes : libres. Violettes : posées cette année.</span></div></div>
    <div><div class="lbl" style="margin-bottom:6px">Salles de calcul · ${all} sur 5</div><div class="rooms">${rooms}</div><div style="font-size:11.5px;font-weight:700;margin-top:6px">Bleu : à vous · rayé : louée · mauve : Microsoft</div></div>
    <div><div class="lbl" style="margin-bottom:6px">Mon modèle</div>
      ${S.tier ? `<div class="paper" style="background:var(--vio);padding:10px 12px;display:flex;gap:12px;align-items:center">${ico('hex', 40, '#fff')}<div style="flex:1"><b class="d" style="font-size:18px">${modelName(S)} · ${SIZES[S.tier - 1].par}</b><div style="font-size:12.5px;font-weight:700">${S.diff === 'open' ? 'Poids ouverts' : 'Fermé'} · qualité ${['correcte', 'bonne', 'percée'][S.quality]}</div><div class="row" style="gap:4px;margin-top:5px">${seals}</div></div></div>` : `<div class="paper" style="border-style:dashed;box-shadow:none;background:rgba(242,240,250,.9);padding:12px"><b class="d">Aucun modèle</b><div style="font-size:13px;font-weight:700">Entraînez-en un à l’atelier.</div></div>`}</div>
    <div class="grid2"><div><div class="lbl" style="margin-bottom:6px">En ligne</div><div class="row" style="flex-wrap:wrap;gap:6px">${prods}</div></div><div><div class="lbl" style="margin-bottom:6px">Contrats</div><div class="row">${ctr}</div></div></div>
    <div class="paper" style="padding:10px 14px;display:flex;flex-direction:column;gap:2px"><span class="cap mut">Équipe de ${S.R + S.E + S.S} personnes</span><span style="font-size:13.5px;font-weight:700">${S.R} personne${plural(S.R, '', 's')} en recherche, ${S.E} en ingénierie, ${S.S} en sécurité.<br>Charges fixes : ${fmt(fc.total, 0)} M$ par an (salaires ${fmt(fc.sal, 0)}, salles ${fmt(fc.up, 0)}${fc.partner ? ', terrain ' + fc.partner : ''}).</span></div>
    <button class="btn" data-a="go" data-v="carnet"><span style="display:flex;align-items:center;gap:10px">${ico('book', 26, '#fff')}Carnet de savoirs · ${KNOWN.size} sur ${SAV_ORDER.length}</span></button>
  </div>`;
};

/* ---------- Carnet ---------- */
SCREENS.carnet = function () {
  const back = S && U.from !== 'cover' ? 'board' : 'cover';
  const tiles = SAV_ORDER.map(id => KNOWN.has(id) ? `<button class="ct" data-a="savoir" data-v="${id}"><span class="cap" style="opacity:.6">${SAVOIRS[id].cat}</span><b>${SAVOIRS[id].t}</b></button>` : `<div class="ct lk"><span class="cap" style="opacity:.7">${SAVOIRS[id].cat}</span><b class="d" style="font-size:20px">?</b></div>`).join('');
  return `${barHTML('Carnet de savoirs', KNOWN.size + ' sur ' + SAV_ORDER.length + ' découverts', U.carnetBack || 'cover')}
  <div class="scroll"><div class="sav"><span class="cap">Comment les débloquer</span><span>Chaque cas se débloque en jouant : une actualité, un produit, un contrat, un test.</span></div><div class="cgrid">${tiles}</div></div>`;
};

/* ---------- Actualité ---------- */
SCREENS.event = function () {
  const e = evById(S.ev.id), done = S.ev.done;
  const tok = (w, col) => {
    const c = e[w];
    const poor = c.cost && S.cash < c.cost;
    const bl = c.b.map(([i, t]) => `<span class="bl">${i === 'text' ? '' : ico(i, 18, '#ffd23f')}${t}</span>`).join('') + (c.die ? `<span class="bl" style="font-weight:700">Il faut ${c.need(S)} ou plus</span>` : '');
    return `<button class="tok ${poor ? 'off' : ''}" style="background:${col}" data-a="${poor ? 'x' : 'evChoose'}" data-v="${w}" ${poor ? 'data-why="Pas assez d’argent pour ce choix."' : ''}><b>${c.t}</b><span style="display:flex;flex-direction:column;gap:4px">${bl}</span></button>`;
  };
  const card = `<div class="paper" style="overflow:hidden;transform:rotate(-1deg);border-radius:24px;box-shadow:0 6px 0 var(--ink)">
    <div class="evart dots">${ico(e.icon, 110, '#f2f0fa')}<span class="pill" style="position:absolute;left:12px;top:12px;background:var(--ink);color:var(--yel);border:0;font-size:11px">Actualité · ${e.tag}</span></div>
    <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px"><span class="d" style="font-size:25px;line-height:1.05">${e.title}</span><span style="font-size:15px;line-height:1.38;font-weight:700">${e.text}</span>
    <div style="background:var(--tint);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;margin-top:2px"><span class="cap" style="opacity:.7">Pourquoi cela arrive</span><span style="font-size:13px;line-height:1.3;font-weight:700">${e.why}</span></div></div></div>`;
  let bottom;
  if (!done) bottom = `<div class="grid2">${tok('a', 'var(--grn)')}${tok('b', 'var(--pin)')}</div>`;
  else {
    const c = e[S.ev.choice];
    const dieEl = S.ev.roll ? `<div class="row" style="align-items:center;gap:12px"><div class="die ${U.evAnim ? 'roll' : ''}" id="evdie">${U.evAnim ? '?' : S.ev.roll}</div><span style="font-size:13px;font-weight:700">${U.evAnim ? 'Le dé roule…' : 'Il fallait ' + c.need(S) + ' ou plus. Vous avez fait ' + S.ev.roll + '.'}</span></div>` : '';
    bottom = `<div class="paper" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px"><span class="cap mut">Votre choix : ${c.t}</span>${dieEl}${U.evAnim ? '' : `<span style="font-size:15px;font-weight:700;line-height:1.3">${S.ev.result}</span>`}</div>`;
  }
  return `<div class="scroll" style="align-items:stretch;padding-top:16px"><div class="row" style="justify-content:space-between"><span class="cap" style="color:var(--yel)">Année ${S.year} · Actualité</span><span class="cap">Carte 1 sur 1</span></div>${card}${bottom}</div>
  ${done && !U.evAnim ? `<div class="foot"><button class="btn" data-a="evContinue">Planifier l’année</button></div>` : ''}`;
};

/* ---------- Lancer ---------- */
function dieHTML(d, done) {
  const cells = ['var(--pin)', 'var(--blu)', 'var(--blu)', 'var(--grn)', 'var(--grn)', 'var(--yel)'];
  const mark = clamp(d.total, 1, 6) - 1;
  const lab = { fail: 'Raté', ok: 'Correct', good: 'Bon', great: 'Percée' }[d.outcome];
  return `<div class="paper" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">
    <div class="row" style="align-items:center;gap:14px"><div class="die roll" id="die">?</div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><span class="cap mut">Entraînement du ${SIZES[d.size - 1].name}</span>
    <div class="dbar">${cells.map((c, i) => `<span style="background:${c};${i === mark ? 'outline:3px solid var(--ink);outline-offset:1px;transform:scaleY(1.35);visibility:' + (done ? 'visible' : 'hidden') : ''}"></span>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700"><span>Raté</span><span>Correct</span><span>Bon</span><span>Percée</span></div></div></div>
    <div id="dres" ${done ? '' : 'hidden'} style="display:${done ? 'flex' : 'none'};flex-direction:column;gap:2px"><span class="d" style="font-size:22px">${lab}</span><span style="font-size:13px;font-weight:700">Dé ${d.roll}${d.bonus ? ' + ' + d.bonus + ' (équipe de recherche)' : ''}${d.pen ? ' − ' + d.pen + ' (il manquait ' + [d.miss.data ? d.miss.data + ' donnée' + plural(d.miss.data, '', 's') : '', d.miss.rooms ? d.miss.rooms + ' salle' + plural(d.miss.rooms, '', 's') : '', d.miss.talent ? d.miss.talent + ' talent' + plural(d.miss.talent, '', 's') : ''].filter(Boolean).join(', ') + ')' : ''} = ${d.total}</span></div></div>`;
}
SCREENS.launch = function () {
  const acts = S.acts.map((a, i) => `<div class="paper act ${a.tone === 'neg' ? 'neg' : ''}" style="animation-delay:${(S.die ? 1.5 : 0) + i * 0.3}s"><span class="ic">${ico(a.icon, 24, '#fff')}</span><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><b>${a.title}</b><span>${a.detail}</span></div></div>`).join('');
  return `<div class="bar"><span class="sq" style="background:var(--pin);border-radius:50%;font-family:var(--d);font-weight:800;font-size:20px">3</span><div class="t"><span>Phase 3 · Lancer</span><b>Lancer l’année ${S.year}</b></div></div>
  <div class="scroll">
    ${S.die ? dieHTML(S.die, U.dieShown) : ''}
    ${acts || '<div class="paper" style="padding:14px;font-weight:700">Vous passez l’année sans lancer d’action. Les charges continuent de courir.</div>'}
  </div>
  <div class="foot"><button class="btn" data-a="afterLaunch">Voir le marché</button></div>`;
};
AFTER.launch = function () {
  if (!S.die || U.dieShown) return;
  const el = document.getElementById('die'), res = document.getElementById('dres');
  let n = 0;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fin = () => { U.dieShown = true; if (el) { el.classList.remove('roll'); el.textContent = S.die.roll; } if (res) { res.hidden = false; res.style.display = 'flex'; } const cells = document.querySelectorAll('.dbar span'); const m = clamp(S.die.total, 1, 6) - 1; if (cells[m]) { cells[m].style.visibility = 'visible'; cells[m].style.outline = '3px solid #1b1740'; cells[m].style.outlineOffset = '1px'; cells[m].style.transform = 'scaleY(1.35)'; } };
  if (reduce) return fin();
  const t = setInterval(() => { if (!document.getElementById('die') || U.screen !== 'launch') { clearInterval(t); return; } n++; const e2 = document.getElementById('die'); if (e2) e2.textContent = 1 + Math.floor(Math.random() * 6); if (n > 12) { clearInterval(t); fin(); } }, 100);
};

/* ---------- Le marché répond ---------- */
SCREENS.recap = function () {
  const r = S.recap, d = r.d;
  const lines = r.lines.map(l => `<div class="rc"><div class="f"><span class="cap mut">Votre choix</span><b>${l.from}</b></div><svg width="20" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M2 7h16M12 2l6 5-6 5" fill="none" stroke="${INK}" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="e">${l.stat ? `<span class="st cap ${l.tone}">${l.stat}</span>` : ''}<span>${l.to}</span></div></div>`).join('');
  const dl = (n, v) => `<div class="dl"><span class="cap">${n}</span><b>${v}</b></div>`;
  const dp = d.P ? (d.P > 0 ? '+' : '−') + Math.abs(d.P) : '=';
  const dc = d.conf ? (d.conf > 0 ? '+' : '−') + Math.abs(d.conf) : '=';
  const du = Math.abs(d.U) < 0.05 ? '=' : (d.U > 0 ? '+' : '−') + fmt(Math.abs(d.U)) + ' M';
  return `<div class="bar"><span class="sq" style="background:var(--amb);border-radius:50%;font-family:var(--d);font-weight:800;font-size:20px">4</span><div class="t"><span>Phase 4 · Le marché répond</span><b>Fin de l’année ${r.year}</b></div></div>
  <div class="scroll">
    ${trackHTML(r.after, r.before)}
    <div class="paper" style="overflow:hidden"><div style="background:var(--ink);color:var(--paper);padding:8px 14px;display:flex;justify-content:space-between;align-items:center"><span class="d" style="font-size:15px;letter-spacing:.04em;text-transform:uppercase">Pourquoi ça s’est passé</span><span style="font-size:11px;font-weight:700;opacity:.75">${r.lines.length} causes</span></div>${lines}</div>
    <div class="deltas">${dl('Argent', (d.cash >= 0 ? '+' : '−') + fmt(Math.abs(d.cash), 0) + ' M$')}${dl('Puissance', dp)}${dl('Confiance', dc)}${dl('Usage', du)}</div>
  </div>
  <div class="foot"><button class="btn" data-a="next">${S.over ? 'Voir le résultat' : 'Année suivante'}</button></div>`;
};
AFTER.recap = function () {
  if (U.pawnsDone === S.year) return;
  U.pawnsDone = S.year;
  setTimeout(() => document.querySelectorAll('.pawn[data-to]').forEach(p => { p.style.left = p.dataset.to; }), 350);
};

/* ---------- Fin de partie ---------- */
SCREENS.end = function () {
  const pw = pawns(S), score = (pw.puis + pw.conf + pw.usage) / 3;
  let t, sub, col = 'var(--yel)';
  if (S.over === 'win') { t = 'Le Seuil est franchi'; sub = `Année ${S.year} : vos trois pions touchent le drapeau. Un laboratoire puissant, utilisé et en qui l’on a confiance.`; col = 'var(--grn)'; }
  else if (S.over === 'bankrupt') { t = 'La pile est à zéro'; sub = 'Les charges ont rattrapé les recettes. Les salaires et les salles de calcul se paient chaque année, même sans revenus.'; col = 'var(--ora)'; }
  else { t = score >= 5 ? 'Un laboratoire respecté' : score >= 3 ? 'Un laboratoire qui tient' : 'Un laboratoire discret'; sub = `${MAXY} années passées. Le Seuil reste devant vous : il manquait ${[pw.puis < SEUIL ? 'de la puissance' : '', pw.conf < SEUIL ? 'de la confiance' : '', pw.usage < SEUIL ? 'de l’audience' : ''].filter(Boolean).join(' et ') || 'un souffle'}.`; }
  const st = (n, v) => `<div class="dl" style="align-items:flex-start;padding:8px 10px"><span class="cap">${n}</span><b style="font-size:17px">${v}</b></div>`;
  const hist = S.history.slice(-10);
  return `<div class="scroll" style="padding-top:18px">
    <div class="paper dots" style="background-color:${col};padding:18px 16px;display:flex;flex-direction:column;gap:8px"><span class="cap">Fin de partie · année ${S.year}</span><span class="d" style="font-size:34px;line-height:1">${t}</span><span style="font-size:14.5px;font-weight:700;line-height:1.3">${sub}</span></div>
    ${trackHTML(pw)}
    <div class="grid2">${st('Modèle', S.tier ? modelName(S) : 'Aucun')}${st('Usage', fmt(S.users) + ' M')}${st('Confiance', S.conf + ' sur 5')}${st('Argent', fmt(S.cash, 0) + ' M$')}</div>
    <div class="sav"><span class="cap">Ce que vous avez appris</span><span>${KNOWN.size} savoir${plural(KNOWN.size, '', 's')} sur ${SAV_ORDER.length} dans votre carnet. Rejouez avec une autre stratégie pour débloquer les autres.</span></div>
  </div>
  <div class="foot"><button class="btn" data-a="new">Rejouer</button><div class="grid2"><button class="btn sec" style="min-height:46px;font-size:15px" data-a="carnetEnd">Carnet de savoirs</button><button class="btn sec" style="min-height:46px;font-size:15px" data-a="toCover">Couverture</button></div></div>`;
};

/* ---------- Fenêtres ---------- */
function modalHTML() {
  const m = U.modal;
  if (m.type === 'how') {
    return `<div class="mask" style="padding:16px 0"><div class="paper" style="padding:16px;display:flex;flex-direction:column;gap:12px"><span class="d" style="font-size:24px">Comment jouer</span>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:14.5px;font-weight:700"><div class="row" style="gap:10px"><span style="flex:none">${meeple('#ffd23f', 26)}</span><span>Vos équipes sont jaunes. Touchez un emplacement pointillé pour y poser une équipe. Retouchez-le pour la reprendre.</span></div>
      <div class="row" style="gap:10px"><span style="flex:none">${ico('hex', 28, '#9d8cff')}</span><span>L’Atelier, le Marché et les produits s’ouvrent sur leur propre écran.</span></div>
      <div class="row" style="gap:10px"><span style="flex:none">${ico('flag', 28, '#ffd23f')}</span><span>Amenez Puissance, Confiance et Usage au drapeau avant la dixième année.</span></div></div>
      <button class="btn" data-a="closeModal">Compris</button></div></div>`;
  }
  if (m.type === 'ind') return indModal(m.id);
  const sv = SAVOIRS[m.id];
  return `<div class="mask" style="padding:12px 0"><div style="display:flex;flex-direction:column;gap:12px">
    <div class="paper" style="overflow:hidden;transform:rotate(.6deg);border-radius:24px;box-shadow:0 6px 0 var(--ink)">
      <div class="dots" style="background-color:var(--pin);border-bottom:3px solid var(--ink);padding:12px 16px;display:flex;align-items:center;gap:14px">${ico('book', 56, '#f2f0fa')}<div style="display:flex;flex-direction:column;line-height:1.05;gap:4px"><span class="cap">${m.fresh ? 'Savoir débloqué · ' : 'Savoir · '}${sv.cat}</span><span class="d" style="font-size:26px">${sv.t}</span></div></div>
      <div class="bk"><span class="cap mut">C’est quoi ?</span><p>${sv.quoi}</p></div>
      <div class="bk t"><span class="cap mut">Dans le jeu</span><p>${sv.jeu}</p></div>
      <div class="bk"><span class="cap mut">Dans le monde réel</span><p>${sv.reel}</p></div></div>
    <button class="btn grn" data-a="closeModal">${m.fresh ? 'Ranger dans le carnet' : 'Fermer'}</button></div></div>`;
}

function showSavoirs(then) {
  if (S && S.newSav && S.newSav.length) { U.modal = { type: 'sav', id: S.newSav.shift(), fresh: true, then }; render(); }
  else then();
}

/* ---------- Fiche d'un indicateur ---------- */
const IND = {
  argent: { t: 'Argent', col: 'var(--yel)', ic: 'coin', what: 'Si la pile tombe à zéro à la fin d’une année, la partie s’arrête.',
    up: ['Entraîner un modèle puis ouvrir un produit : sans eux, aucune recette.', 'Choisir un prix qui rapporte : Payant seulement ou Paliers plutôt que Gratuit.', 'Signer des contrats : Cursor, Microsoft, recherche médicale, constructeur automobile.', 'Accepter un financement quand il se présente.', 'Garder des serveurs qui tiennent : la saturation retire 20 % des revenus.'],
    down: ['Les salaires : 2 M$ par an et par personne.', 'Les salles de calcul : 3 M$ par an et par salle, plus leur achat.', 'Les entraînements, les produits, les licences, les tests.', 'Les réponses au public : plus il y en a, plus la facture monte.', 'Le Gratuit et les poids ouverts : beaucoup d’usage, peu de revenus.'],
    now: S => `Charges fixes de l’année : ${fmt(fixedCosts(S).total, 0)} M$ (salaires ${fmt(fixedCosts(S).sal, 0)}, salles ${fmt(fixedCosts(S).up, 0)}).` },
  puis: { t: 'Puissance', col: 'var(--blu)', ic: 'hex', what: 'Ce que sait faire votre meilleur modèle. Le drapeau est à ' + SEUIL + ' sur 10.',
    up: ['Entraîner un modèle plus gros : Petit, Moyen, Grand, puis Frontière à l’année 6.', 'Réussir le dé de recherche : recruter en recherche aide, et rien ne doit manquer dans la recette.', 'Réentraîner le même modèle pour en améliorer la qualité.', 'Terminer un contrat Robots : le modèle gagne 1.'],
    down: ['Un entraînement raté : l’argent est perdu.', 'Trop de données synthétiques : le modèle s’appauvrit.', 'Ignorer des données polluées.'],
    now: S => S.tier ? `Modèle ${modelName(S)}, qualité ${['correcte', 'bonne', 'percée'][S.quality]} : ${power(S)} sur 10.` : 'Aucun modèle : entraînez-en un à l’atelier.' },
  conf: { t: 'Confiance', col: 'var(--grn)', ic: 'shield', what: 'Le crédit que vous accorde le public. Elle multiplie votre croissance. Le drapeau est à 3 sur 5.',
    up: ['Tester votre modèle : chaque sceau réduit le risque et, bien testé, la confiance monte d’un point par an.', 'Recruter des personnes en sécurité.', 'Répondre aux alertes : rapport au régulateur, filigrane, énergie renouvelable.', 'Un contrat de recherche médicale réussi.', 'Publier des poids ouverts seulement après 2 sceaux.'],
    down: ['Un incident : plus le modèle est gros et peu testé, plus c’est probable.', 'Des serveurs saturés.', 'Les produits agents et images, et les poids ouverts, qui augmentent le risque.', 'Ignorer un jailbreak, un deepfake ou une réponse fausse.', 'Refuser de rendre des comptes ou accepter la pression d’un fonds d’investissement.'],
    now: S => S.tier ? `Votre modèle a ${S.seals} sceau${S.seals > 1 ? 'x' : ''} sur ${Math.min(S.tier, 3)} utiles. Confiance : ${S.conf} sur 5.` : `Confiance : ${S.conf} sur 5.` },
  usage: { t: 'Usage', col: 'var(--pin)', ic: 'person', what: 'Combien de millions de personnes vous utilisent. Le drapeau est à 15 millions.',
    up: ['Un modèle plus puissant attire plus de monde.', 'Plus de produits : chat, voix, images, code, agents.', 'Un prix plus ouvert : Freemium ou Gratuit.', 'Les poids ouverts : l’usage presque double.', 'Cursor, et un bon niveau de confiance.'],
    down: ['Chaque année, 12 % du public s’en va.', 'Des serveurs saturés : 8 % de plus partent.', 'Un prix Payant seulement freine les curieux.', 'Un rival qui publie un modèle ouvert.', 'Une confiance basse.'],
    now: S => `${fmt(S.users)} million${S.users >= 2 ? 's' : ''} de personnes qui vous utilisent aujourd’hui.` }
};
function indModal(k) {
  const d = IND[k];
  const li = (arr, sign, c) => arr.map(t => `<div class="row" style="gap:8px;align-items:flex-start"><span style="width:20px;height:20px;flex:none;border-radius:50%;background:${c};border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;line-height:1;font-size:14px">${sign}</span><span style="font-size:14px;font-weight:700;line-height:1.3">${t}</span></div>`).join('');
  return `<div class="mask" style="padding:12px 0"><div style="display:flex;flex-direction:column;gap:12px">
    <div class="paper" style="overflow:hidden;border-radius:22px;box-shadow:0 6px 0 var(--ink)">
      <div class="dots" style="background-color:${d.col};border-bottom:3px solid var(--ink);padding:12px 16px;display:flex;align-items:center;gap:12px">${ico(d.ic, 40, '#f2f0fa')}<div style="display:flex;flex-direction:column;gap:2px"><span class="d" style="font-size:26px;line-height:1">${d.t}</span><span style="font-size:13px;font-weight:700;line-height:1.25">${d.what}</span></div></div>
      <div class="bk t"><span class="cap mut">Où vous en êtes</span><p>${d.now(S)}</p></div>
      <div class="bk" style="gap:8px"><span class="cap mut">Ce qui le fait monter</span>${li(d.up, '+', 'var(--grn)')}</div>
      <div class="bk" style="gap:8px"><span class="cap mut">Ce qui le fait baisser</span>${li(d.down, '−', 'var(--ora)')}</div></div>
    <button class="btn" data-a="closeModal">Fermer</button></div></div>`;
}
/* ===== INTERFACE : actions ===== */
function toggleSpot(k, p) {
  if (planned(S, k)) { unplace(S, k); render(); return true; }
  const r = place(S, k, p);
  if (!r.ok) { toast(r.why); return false; }
  render(); return true;
}

function startMarket() { const mk = planned(S, 'mkt'); U.selPrice = mk ? mk.p.price : S.price; U.selDiff = mk ? mk.p.diff : S.diff; U.tipK = 'price'; }

function act(a, v) {
  switch (a) {
    case 'x': return;
    case 'new': {
      KNOWN; S = newState(); clearSave(); U.dieShown = false; U.pawnsDone = 0; U.modal = KNOWN.size < 3 ? { type: 'how' } : null;
      return go('board');
    }
    case 'resume': {
      const sv = loadSave(); if (!sv) return;
      S = sv.S; U.dieShown = true; U.pawnsDone = S.year; U.modal = null;
      let scr = sv.screen || 'board';
      if (scr === 'event' && !S.ev) scr = 'board';
      if (scr === 'recap' && !S.recap) scr = 'board';
      if (scr === 'launch' && !S.acts) scr = 'board';
      return go(scr);
    }
    case 'toCover': S = null; return go('cover');
    case 'go': {
      if (v === 'market') startMarket();
      if (v === 'prod' && !PROD_ORDER.includes(U.selProd)) U.selProd = 'voice';
      if (v === 'atelier') { const t = planned(S, 'train'); U.selSize = t ? t.p : clamp(Math.max(S.tier, 1) + (S.tier >= 1 ? 1 : 0), 1, 3); if (SIZES[U.selSize - 1].unlock && S.year < SIZES[U.selSize - 1].unlock) U.selSize = S.tier || 1; if (!t && S.tier === 0) U.selSize = 1; }
      if (v === 'carnet') U.carnetBack = U.screen === 'cover' ? 'cover' : U.screen === 'end' ? 'end' : 'board';
      return go(v);
    }
    case 'carnetEnd': U.carnetBack = 'end'; return go('carnet');
    case 'spot': return toggleSpot(v);
    case 'fix': { const r = place(S, v); if (!r.ok) toast(r.why); render(); return; }
    case 'selSize': U.selSize = +v; return render();
    case 'trainPlace': {
      const ex = planned(S, 'train');
      if (ex && ex.p === U.selSize) { unplace(S, 'train'); return render(); }
      if (ex) unplace(S, 'train');
      const r = place(S, 'train', U.selSize);
      if (!r.ok) { if (ex) place(S, 'train', ex.p); toast(r.why); return; }
      return go('board');
    }
    case 'selPrice': U.selPrice = v; U.tipK = 'price'; return render();
    case 'selDiff': {
      if (v === 'closed' && S.diff === 'open') { toast('Un modèle publié ne se retire plus.'); return; }
      if (v === 'open' && hasContract(S, 'ms')) { toast('Microsoft vous interdit les poids ouverts.'); return; }
      U.selDiff = v; U.tipK = 'diff'; return render();
    }
    case 'confirmMkt': {
      const ex = planned(S, 'mkt');
      if (ex && ex.p.price === U.selPrice && ex.p.diff === U.selDiff) { unplace(S, 'mkt'); return render(); }
      if (ex) unplace(S, 'mkt');
      const r = place(S, 'mkt', { price: U.selPrice, diff: U.selDiff });
      if (!r.ok) { if (ex) place(S, 'mkt', ex.p); toast(r.why); return; }
      return go('board');
    }
    case 'selProd': U.selProd = v; return render();
    case 'launchProd': {
      const k = 'prod:' + U.selProd;
      if (planned(S, k)) { unplace(S, k); return render(); }
      const r = place(S, k); if (!r.ok) { toast(r.why); return; }
      return go('board');
    }
    case 'selPart': U.selPart = v; return render();
    case 'nextPart': { const i = PART_ORDER.indexOf(U.selPart); U.selPart = PART_ORDER[(i + 1) % PART_ORDER.length]; return render(); }
    case 'signPart': {
      const k = 'part:' + U.selPart;
      if (planned(S, k)) { unplace(S, k); return render(); }
      const r = place(S, k); if (!r.ok) { toast(r.why); return; }
      return go('board');
    }
    case 'opp': {
      const h = S.hand.find(x => x.id === v), o = OPPS.find(x => x.id === v);
      if (h && h.used) { toast('Cette opportunité est déjà utilisée.'); return; }
      if (v === 'lic') return toggleSpot('lic');
      if (v === 'build') return toggleSpot('build');
      if (v === 'test') return toggleSpot('test');
      if (v === 'hire') return toggleSpot('hireR');
      if (v === 'train') { U.selSize = Math.max(1, S.tier + (S.tier ? 1 : 0)); if (SIZES[U.selSize - 1].unlock && S.year < SIZES[U.selSize - 1].unlock) U.selSize = S.tier || 1; return go('atelier'); }
      if (v === 'voice') { U.selProd = 'voice'; return go('prod'); }
      if (v === 'cursor') { U.selPart = 'cursor'; return go('part'); }
      if (v === 'open') { startMarket(); U.selDiff = 'open'; U.tipK = 'diff'; return go('market'); }
      return;
    }
    case 'ind': U.modal = { type: 'ind', id: v }; return render();
    case 'savoir': U.modal = { type: 'sav', id: v, fresh: false }; return render();
    case 'closeModal': {
      const th = U.modal && U.modal.then; U.modal = null;
      if (th) return showSavoirs(th);
      return render();
    }
    case 'launch': {
      resolve(S); U.dieShown = false;
      return go('launch');
    }
    case 'afterLaunch': {
      if (!(S.recap && S.recap.year === S.year)) endYear(S);
      return showSavoirs(() => { U.modal = null; go('recap'); });
    }
    case 'next': {
      if (S.over) { clearSave(); save(); return go('end'); }
      nextYear(S);
      return go(S.ev ? 'event' : 'board');
    }
    case 'evChoose': {
      const ok = chooseEvent(S, v);
      if (!ok) { toast('Pas assez d’argent pour ce choix.'); return; }
      if (S.ev.roll) { U.evAnim = true; render(); setTimeout(() => { U.evAnim = false; render(); }, 1100); }
      else render();
      save();
      return;
    }
    case 'evContinue': return showSavoirs(() => { U.modal = null; go('board'); });
  }
}

$app.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  if (t.classList.contains('off')) { toast(t.dataset.why || 'Pas possible maintenant.'); return; }
  act(t.dataset.a, t.dataset.v);
});

loadKnown();
window.__g = { get S() { return S; }, U, act, go, render };
render();
</script>

</body></html>
