<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gradient</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Plateau de jeu de société : table violette, cartes papier, ombres décalées dures.
   Une seule ambiance sombre voulue : la table. */
:root{
  --table:#2a2566; --table2:#3b3496; --paper:#f2f0fa; --ink:#1b1740; --tint:#e6e1fb;
  --yel:#ffd23f; --blu:#27b3ff; --grn:#39c18a; --pin:#ff6fa5; --ora:#ff6b3d; --amb:#ff9f1c; --vio:#9d8cff;
  --good:#c9f3df; --bad:#ffe3d6;
  --d:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --b:'Atkinson Hyperlegible',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background-color:var(--table);
  background-image:radial-gradient(circle at 50% 28%,var(--table2) 0,rgba(42,37,102,0) 62%),radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);
  background-size:auto,7px 7px;color:var(--paper);font-family:var(--b);font-size:15px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:12px 2px 14px;scrollbar-width:thin;scrollbar-color:rgba(242,240,250,.35) transparent}
.scroll>*{flex:none}
.foot{flex:none;padding:8px 0 10px;display:flex;flex-direction:column;gap:8px}

/* Type */
.d{font-family:var(--d);font-weight:800}
.lbl{font-family:var(--d);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper)}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.mut{opacity:.7}
.ink{color:var(--ink)}

/* Objets */
.paper{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.dots{background-image:radial-gradient(rgba(27,23,64,.16) 1px,transparent 1.4px);background-size:6px 6px}
.btn{min-height:52px;padding:6px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--yel);color:var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--d);font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;transition:transform .08s,box-shadow .08s}
.btn small{font-family:var(--b);font-weight:700;font-size:12px}
.btn:active:not(.off){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sec{background:var(--paper)}
.btn.grn{background:var(--grn)}
.btn.off{background:rgba(242,240,250,.55);color:rgba(27,23,64,.7);box-shadow:0 2px 0 rgba(27,23,64,.6);border-color:rgba(27,23,64,.7);transform:translateY(2px)}
.row{display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;background:var(--paper);color:var(--ink)}
.chip.ok{background:var(--good)}
.chip.no{background:var(--bad);border-color:var(--ora)}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);padding:8px 10px;flex:none;margin-top:12px}
.bar .t{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
.bar .t b{font-family:var(--d);font-weight:800;font-size:21px}
.bar .t span{font-size:11px;font-weight:700;opacity:.65;letter-spacing:.06em;text-transform:uppercase}
.sq{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--ink);background:var(--blu);display:grid;place-items:center;padding:0;color:var(--ink)}
.sq.y{background:var(--yel)}

/* Bulle de savoir */
.sav{background:var(--yel);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.sav .cap{font-size:11px}
.sav span:last-child{font-size:14px;line-height:1.3;font-weight:700}

/* Bandeau de plateau */
.hud{flex:none;margin-top:10px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.hud .top{display:flex;align-items:center;gap:8px}
.phases{display:flex;gap:4px;flex:1;min-width:0}
.ph{flex:1;font-size:10.5px;font-weight:700;text-align:center;padding:4px 2px;border-radius:99px;border:2px solid rgba(27,23,64,.35);color:rgba(27,23,64,.55);white-space:nowrap;overflow:hidden;text-overflow:clip}
.ph.on{background:var(--ink);color:var(--yel);border-color:var(--ink)}
.ph.done{background:var(--tint);color:var(--ink);border-color:var(--ink)}
.inds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ind{text-align:left;font-family:var(--b);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:6px 5px 7px;border:2.5px solid var(--ink);border-radius:12px;min-width:0}
.ind .cap{font-size:9.5px;letter-spacing:.02em;display:flex;align-items:center;gap:3px;white-space:nowrap}
.ind b{font-family:var(--d);font-weight:800;font-size:18px;line-height:1.05;white-space:nowrap}
.ind small{font-size:11px;font-weight:700;line-height:1.1;min-height:12px}
.pips{display:flex;gap:2px}
.pips i{flex:1;height:7px;border:1.5px solid var(--ink);border-radius:2px;background:rgba(27,23,64,.1);max-width:14px}
.pips i.f{background:var(--ink)}

/* Piste vers le Seuil */
.track{padding:10px 14px 8px;border:2.5px solid rgba(242,240,250,.5);border-radius:18px;background:rgba(242,240,250,.08);display:flex;flex-direction:column;gap:4px}
.lane{position:relative;height:50px}
.lane .rail{position:absolute;left:0;right:0;top:33px;height:6px;background:repeating-linear-gradient(90deg,rgba(242,240,250,.7) 0 12px,transparent 12px 18px)}
.flag{position:absolute;top:2px;width:2px;height:37px;background:var(--yel)}
.flag::before{content:"";position:absolute;left:2px;top:0;width:24px;height:14px;background:var(--yel);clip-path:polygon(0 0,100% 50%,0 100%)}
.pawn{position:absolute;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:left 1.1s cubic-bezier(.3,1.4,.5,1)}
.ghost{position:absolute;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2.5px dashed currentColor}
.trackkey{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--paper)}
.trackkey span{display:flex;align-items:center;gap:5px}
.trackkey i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);display:inline-block}

/* Zones */
.zone{overflow:hidden;display:flex;flex-direction:column}
.zone>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:3px solid var(--ink)}
.zone>header b{font-family:var(--d);font-weight:800;font-size:18px}
.zone>header span{font-size:12px;font-weight:700}
.zone .body{padding:10px 8px 10px;display:flex;flex-direction:column;gap:8px}
.spots{display:flex;gap:4px;justify-content:space-around}
.spot{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:2px;min-width:0;flex:1;color:var(--ink);font-family:var(--b)}
.ring{width:58px;height:58px;border-radius:50%;border:2.5px dashed var(--ink);display:grid;place-items:center;background:rgba(27,23,64,.04);position:relative;transition:transform .1s}
.spot:active .ring{transform:scale(.94)}
.spot.on .ring{border-style:solid;background:var(--tint)}
.spot .nm{font-size:13px;font-weight:700;line-height:1.1;text-align:center}
.spot .co{font-size:11px;font-weight:700;background:var(--ink);color:var(--yel);padding:1px 7px;border-radius:99px;white-space:nowrap}
.spot .co.fr{background:var(--grn);color:var(--ink)}
.spot.lock .ring{opacity:.45}
.spot.lock .nm{opacity:.6}
.mp{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.rooms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.room{height:38px;border-radius:9px;border:2.5px solid var(--ink);display:grid;place-items:center}
.room.o{background:var(--blu);box-shadow:0 2px 0 var(--ink)}
.room.r{background:repeating-linear-gradient(45deg,var(--blu) 0 5px,var(--paper) 5px 10px);box-shadow:0 2px 0 var(--ink)}
.room.m{background:var(--vio);box-shadow:0 2px 0 var(--ink)}
.room.e{border-style:dashed;opacity:.6}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;text-align:left;min-height:62px;padding:8px 10px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:2px;color:var(--ink);font-family:var(--b)}
.tile .cap{font-size:10.5px;opacity:.65}
.tile b{font-family:var(--d);font-weight:800;font-size:15px;line-height:1.1}
.tile .tm{position:absolute;right:6px;top:6px}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mini{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700}

/* Main */
.hand{display:flex;padding:6px 6px 14px 22px;overflow-x:auto;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.card{flex:none;width:112px;min-height:138px;margin-left:-16px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative;font-family:var(--b);transition:transform .15s}
.card:nth-child(1){transform:rotate(-4deg)}
.card:nth-child(2){transform:rotate(-1.5deg) translateY(-3px)}
.card:nth-child(3){transform:rotate(1.5deg) translateY(-3px)}
.card:nth-child(4){transform:rotate(4deg)}
.card:active{transform:translateY(-8px) rotate(0)}
.card b{font-family:var(--d);font-weight:800;font-size:14px;line-height:1.05}
.card .z{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--yel);border-radius:99px;padding:1px 7px;align-self:flex-start}
.card span.d2{font-size:12px;font-weight:700;line-height:1.2}
.card.used{opacity:.55}
.card.used::after{content:"Utilisée";position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:700;background:var(--grn);border:2px solid var(--ink);border-radius:99px;padding:0 6px}
.tray{display:flex;align-items:center;gap:10px}
.tray .mps{display:flex;gap:2px;align-items:flex-end}
.tray .tx{flex:1;font-size:12px;font-weight:700;line-height:1.2}

/* Jarres, dés, pastilles */
.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jar{padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.jar.mq{border-color:var(--ora)}
.jarb{position:relative;width:34px;height:96px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.jarb .fl{position:absolute;left:0;right:0;bottom:0;border-top:2.5px solid var(--ink);transition:height .5s}
.jarb .rq{position:absolute;left:0;right:0;border-top:2.5px dashed var(--ink)}
.die{width:56px;height:56px;flex:none;border-radius:12px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transform:rotate(-8deg);display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:28px}
.die.roll{animation:roll .5s linear infinite}
@keyframes roll{0%{transform:rotate(-8deg) translateY(0)}25%{transform:rotate(80deg) translateY(-8px)}50%{transform:rotate(170deg) translateY(0)}75%{transform:rotate(260deg) translateY(-6px)}100%{transform:rotate(352deg) translateY(0)}}
.dbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;height:22px}
.dbar span{border:2px solid var(--ink)}
.shelf{display:flex;align-items:flex-end;gap:8px}
.size{flex:1;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:8px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-width:0;font-family:var(--b)}
.size b{font-family:var(--d);font-weight:800;font-size:15px;line-height:1}
.size small{font-size:11px;font-weight:700;opacity:.8;line-height:1.15}
.size.sel{background:var(--yel);border-width:3px;box-shadow:0 5px 0 var(--ink);transform:translateY(-4px)}
.size.lk{border-style:dashed;box-shadow:none;background:rgba(242,240,250,.9)}
.size .tg{font-size:10.5px;font-weight:700;background:var(--ink);color:var(--yel);border-radius:99px;padding:1px 6px}

/* Prix */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.door{text-align:left;padding:10px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:4px;font-family:var(--b);min-height:92px}
.door b{font-family:var(--d);font-weight:800;font-size:17px;line-height:1.05}
.door.sel{background:var(--yel);box-shadow:0 5px 0 var(--ink);transform:translateY(-3px);border-width:3px}
.door.lk{border-style:dashed;box-shadow:none;opacity:.75}
.prow{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr);gap:6px;align-items:center;padding:7px 10px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--b);min-height:50px}
.prow.sel{background:var(--yel);border-width:3px;box-shadow:0 5px 0 var(--ink);transform:translateY(-2px)}
.prow b{font-family:var(--d);font-weight:800;font-size:15px;line-height:1.05}
.prow .pb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pbx{display:flex;flex-direction:column;gap:2px}
.pbx span{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pbx .pips i{height:7px}

/* Produits */
.hexa{position:relative;height:322px;flex:none;width:358px;align-self:center}
@media (max-width:392px){.hexa{transform:scale(.9);transform-origin:top center;margin-bottom:-32px}}
.piece{position:absolute;width:76px;height:76px;border:3px solid var(--ink);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--ink);font-family:var(--b);box-shadow:0 3px 0 var(--ink)}
.piece b{font-family:var(--d);font-weight:800;font-size:13px;line-height:1}
.piece small{font-size:10.5px;font-weight:700;line-height:1}
.piece.lk{background:var(--paper);border-style:dashed;box-shadow:none;opacity:.9}
.piece.av{background:#fff}
.piece.sel{box-shadow:0 6px 0 var(--ink);transform:translateY(-4px);outline:3px solid var(--yel);outline-offset:2px}

/* Contrats */
.slot{flex:1;height:48px;border:2.5px dashed rgba(242,240,250,.65);border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--paper);text-align:center;padding:0 4px}
.slot.fill{border-style:solid;background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.crow{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);text-align:left;width:100%;font-family:var(--b)}
.crow.lk{border-style:dashed;box-shadow:none;background:rgba(242,240,250,.9)}
.crow .n{flex:1;display:flex;flex-direction:column;line-height:1.1}
.crow .n b{font-family:var(--d);font-weight:800;font-size:16px}
.crow .n span{font-size:12px;font-weight:700;opacity:.75}

/* Savoir / Actualité */
.mask>*{width:100%;max-width:520px;margin-left:auto;margin-right:auto}
.mask{position:absolute;inset:0;background:rgba(20,16,60,.78);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 0 10px;z-index:20;overflow-y:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bk{padding:11px 16px;display:flex;flex-direction:column;gap:3px;border-bottom:2px solid rgba(27,23,64,.18)}
.bk:last-child{border-bottom:0}
.bk p{margin:0;font-size:14.5px;line-height:1.32;font-weight:700}
.bk.t{background:var(--tint)}
.evart{height:150px;background-color:var(--yel);border-bottom:3px solid var(--ink);position:relative;display:grid;place-items:center}
.tok{text-align:left;min-height:116px;padding:12px;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:6px;color:var(--ink);font-family:var(--b)}
.tok b{font-family:var(--d);font-weight:800;font-size:17px;line-height:1.1}
.tok .bl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;line-height:1.2}
.tok:active:not(.off){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tok.off{opacity:.55;box-shadow:none}

/* Lancer / bilan */
.act{display:flex;align-items:center;gap:12px;padding:10px 12px;opacity:0;transform:translateY(10px);animation:up .35s forwards}
@keyframes up{to{opacity:1;transform:none}}
.act .ic{width:40px;height:40px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:var(--yel);display:grid;place-items:center}
.act.neg .ic{background:var(--ora)}
.act b{font-family:var(--d);font-weight:800;font-size:15.5px;line-height:1.1}
.act span{font-size:13px;font-weight:700;line-height:1.25}
.rc{padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1.1fr);align-items:center;gap:8px;border-bottom:2px dashed rgba(27,23,64,.25)}
.rc:last-child{border-bottom:0}
.rc .f{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.rc .f b{font-family:var(--d);font-weight:800;font-size:14px}
.rc .e{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.rc .e span{font-size:12.5px;font-weight:700}
.rc .e .st{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.rc .e .st.pos{color:#0f7a4f}.rc .e .st.neg{color:#b53a12}
.deltas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dl{padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.dl .cap{font-size:10px;letter-spacing:.05em}
.dl b{font-family:var(--d);font-weight:800;font-size:16px;white-space:nowrap}

/* Couverture */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:12px 0}
.title{font-family:var(--d);font-weight:800;font-size:72px;line-height:.9;color:var(--paper);text-shadow:4px 4px 0 var(--ink),-1px -1px 0 var(--ink);margin:0;letter-spacing:-.01em}

/* Toast */
.toast{position:absolute;left:8px;right:8px;bottom:84px;z-index:30;background:var(--ink);color:var(--paper);border:2.5px solid var(--yel);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;text-align:center;animation:up .2s forwards;pointer-events:none}

/* Carnet */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media (min-width:900px){

}

const hasContract = (S, id) => S.contracts.some(c => c.id === id);
const msRooms = S => (hasContract(S, 'ms') ? 2 : 0);
const roomsAll = S => S.rooms + S.rented + msRooms(S);
const power = S => (S.tier ? clamp(S.tier * 2 - 1 + S.quality + S.bonusP, 0, 10) : 0);
const teamsTotal = S => Math.max(1, S.teams - S.yr.teamsLost);
const teamsFree = S => teamsTotal(S) - S.plan.length;
const priceOf = S => PRICES.find(p => p.id === S.price);
const reserved = S => S.plan.reduce((a, p) => a + p.cost, 0);
const planned = (S, k) => S.plan.find(x => x.k === k);
const modelName = S => (S.tier ? SIZES[S.tier - 1].name : 'Aucun');

function pawns(S) {
  return { puis: power(S), conf: S.conf * 2, usage: Math.min(10, S.users / 2.5) };
}

/* ---------- Main : cartes opportunité ---------- */
function drawHand(S) {
  const ok = {
    lic: () => true, build: () => S.rooms < ROOM_MAX, train: () => true,
    test: () => S.tier >= 1, hire: () => true,
    voice: () => S.tier >= 2 && !S.products.voice, cursor: () => S.tier >= 2 && !hasContract(S, 'cursor'),
    open: () => S.diff === 'closed' && !hasContract(S, 'ms')
  };
  const pool = OPPS.filter(o => ok[o.id]());
  const hand = [];
  while (hand.length < 4 && pool.length) {
    hand.push({ id: pool.splice(Math.floor(rnd() * pool.length), 1)[0].id, used: false });
  }
  S.hand = hand;
}
const OPP_MULT = { lic: 0.6, build: 0.65, train: 0.7, test: 0, hire: 0, voice: 0.65, cursor: 1, open: 1 };

function oppFor(S, k, p) {
  const id = OPP_KEY[k];
  if (!id) return null;
  if (k === 'mkt' && !(p && p.diff === 'open' && S.diff !== 'open')) return null;
  return S.hand.find(h => h.id === id && !h.used) || null;
}

function costOf(S, k, p) {
  let base = 0;
  if (k === 'lic') base = 8;
  else if (k === 'syn') base = 4;
  else if (k === 'build') base = 18;
  else if (k === 'rent') base = 6;
  else if (k.startsWith('hire')) base = 4;
  else if (k === 'test') base = 3;
  else if (k === 'train') base = SIZES[p - 1].cost;
  else if (k === 'mkt') base = 2;
  else if (k.startsWith('prod:')) base = PRODUCTS[k.slice(5)].cost;
  const o = oppFor(S, k, p);
  return o ? Math.round(base * OPP_MULT[o.id]) : base;
}

/* ---------- Projection : état prévu une fois le plan joué ---------- */
function proj(S) {
  const q = { data: S.data, rooms: S.rooms, rent: S.rented, R: S.R, E: S.E, S: S.S };
  S.plan.forEach(p => {
    if (p.k === 'web' || p.k === 'syn') q.data += 1;
    else if (p.k === 'lic') q.data += 2;
    else if (p.k === 'build') q.rooms += 1;
    else if (p.k === 'rent') q.rent += 1;
    else if (p.k === 'hireR') q.R += 1;
    else if (p.k === 'hireE') q.E += 1;
    else if (p.k === 'hireS') q.S += 1;
  });
  q.data = Math.min(DATA_MAX, q.data);
  q.roomsAll = q.rooms + q.rent + msRooms(S);
  return q;
}

function trainInfo(S, sizeId) {
  const sz = SIZES[sizeId - 1];
  const q = proj(S);
  const miss = {
    data: Math.max(0, sz.data - q.data),
    rooms: Math.max(0, sz.rooms - q.roomsAll),
    talent: Math.max(0, sz.talent - (q.R + q.E))
  };
  const pen = miss.data + miss.rooms + miss.talent;
  return { sz, q, miss, pen, bonus: Math.min(2, Math.floor(q.R / 2)) + S.yr.dieBonus };
}

/* ---------- Placement des équipes ---------- */
function canPlace(S, k, p) {
  if (planned(S, k)) return { ok: false, why: 'Cette équipe est déjà posée ici.' };
  if (teamsFree(S) <= 0) return { ok: false, why: 'Plus aucune équipe libre.' };
  const cost = costOf(S, k, p);
  if (S.cash - reserved(S) < cost) return { ok: false, why: 'Pas assez d’argent pour ça.' };
  const q = proj(S);
  const no = why => ({ ok: false, why });
  if (k === 'web' || k === 'lic') { if (q.data >= DATA_MAX) return no('Le bocal de données est plein.'); }
  else if (k === 'syn') {
    if (S.tier < 1) return no('Il faut déjà un modèle pour générer des données.');
    if (q.data >= DATA_MAX) return no('Le bocal de données est plein.');
  } else if (k === 'build') {
    if (S.yr.lockCalcul) return no('Pénurie de puces : le calcul est bloqué cette année.');
    if (q.rooms >= ROOM_MAX) return no('Cinq salles au maximum.');
  } else if (k === 'rent') {
    if (S.yr.lockCalcul) return no('Pénurie de puces : le calcul est bloqué cette année.');
    if (q.rent >= 3) return no('Trois salles louées au maximum.');
  } else if (k.startsWith('hire')) {
    const f = k.slice(4);
    if (q[f] >= TALENT_MAX) return no('Cinq personnes au maximum dans ce métier.');
  } else if (k === 'test') {
    if (S.tier < 1 && !S.plan.some(x => x.k === 'train')) return no('Il faut un modèle à tester.');
    if (S.seals >= SEAL_MAX) return no('Votre modèle a déjà tous ses sceaux.');
  } else if (k === 'train') {
    const sz = SIZES[p - 1];
    if (sz.unlock && S.year < sz.unlock) return no('Cette taille se débloque à l’année ' + sz.unlock + '.');
    if (p < S.tier) return no('Votre modèle actuel est déjà plus gros.');
  } else if (k === 'mkt') {
    if (S.price === p.price && S.diff === p.diff) return no('Rien ne change par rapport à aujourd’hui.');
    if (S.diff === 'open' && p.diff === 'closed') return no('Un modèle publié ne se retire plus.');
    if (p.diff === 'open' && hasContract(S, 'ms')) return no('Microsoft vous interdit les poids ouverts.');
  } else if (k.startsWith('prod:')) {
    const id = k.slice(5), pd = PRODUCTS[id];
    if (S.products[id]) return no('Ce produit est déjà en ligne.');
    const miss = pd.req.find(r => !r.f(S));
    if (miss) return no('Il manque : ' + miss.t + '.');
  } else if (k.startsWith('part:')) {
    const id = k.slice(5), pt = PARTNERS[id];
    if (hasContract(S, id)) return no('Ce contrat est déjà signé.');
    const slots = S.contracts.length + S.plan.filter(x => x.k.startsWith('part:')).length;
    if (slots >= 2) return no('Deux contrats au maximum.');
    const miss = pt.req.find(r => !r.f(S));
    if (miss) return no('Il manque : ' + miss.t + '.');
    if (id === 'ms' && S.diff === 'open') return no('Vos poids sont ouverts : Microsoft refuse.');
    if (id === 'ms' && S.plan.some(x => x.k === 'mkt' && x.p.diff === 'open')) return no('Vous prévoyez d’ouvrir vos poids : Microsoft refuse.');
  }
  return { ok: true, cost };
}

function place(S, k, p) {
  const r = canPlace(S, k, p);
  if (!r.ok) return r;
  const o = oppFor(S, k, p);
  if (o) o.used = true;
  S.plan.push({ k, p, cost: r.cost, opp: o ? o.id : null });
  return r;
}

function unplace(S, k) {
  const i = S.plan.findIndex(x => x.k === k);
  if (i < 0) return;
  const it = S.plan[i];
  if (it.opp) { const h = S.hand.find(h => h.id === it.opp); if (h) h.used = false; }
  S.plan.splice(i, 1);
  // Retirer ce qui ne tient plus sans lui
  if (k === 'mkt') S.plan.filter(x => x.k === 'part:ms').forEach(() => {});
}

/* ---------- Lancer l'année ---------- */
const RANK = k => ['web', 'lic', 'syn', 'build', 'rent', 'hireR', 'hireE', 'hireS', 'mkt'].indexOf(k) >= 0
  ? ['web', 'lic', 'syn', 'build', 'rent', 'hireR', 'hireE', 'hireS', 'mkt'].indexOf(k)
  : k.startsWith('prod:') ? 20 : k.startsWith('part:') ? 30 : k === 'train' ? 40 : 50;

function resolve(S) {
  const acts = [];
  let die = null;
  const total = reserved(S);
  S.cash -= total;
  S.yr.powerBefore = power(S);
  const items = [...S.plan].sort((a, b) => RANK(a.k) - RANK(b.k));
  items.forEach(it => {
    const k = it.k, p = it.p;
    const add = (title, detail, icon, tone) => acts.push({ k, title, detail, icon, tone: tone || 'pos', cost: it.cost });
    if (k === 'web') {
      S.data = Math.min(DATA_MAX, S.data + 1); S.webUses++; unlock(S, 'donnees');
      add('Web libre', '+1 donnée. Gratuit, mais des autrices et auteurs pourraient s’en plaindre.', 'globe');
    } else if (k === 'lic') {
      S.data = Math.min(DATA_MAX, S.data + 2); S.webUses = Math.max(0, S.webUses - 1); unlock(S, 'donnees');
      add('Licences', '+2 données, sous contrat avec des maisons d’édition.', 'doc');
    } else if (k === 'syn') {
      S.data = Math.min(DATA_MAX, S.data + 1); S.synthUses++; unlock(S, 'synth');
      add('Synthèse', '+1 donnée, écrite par votre propre modèle.', 'spark');
      if (S.synthUses >= 3 && !S.collapsed) {
        S.collapsed = true; unlock(S, 'collapse');
        if (S.quality > 0) S.quality--; else S.bonusP = Math.max(-1, S.bonusP - 1);
        acts.push({ k, title: 'Effondrement', detail: 'Trop de données synthétiques : la qualité du modèle baisse.', icon: 'spark', tone: 'neg', cost: 0 });
      }
    } else if (k === 'build') {
      S.rooms++; unlock(S, 'puces');
      add('Nouvelle salle', '+1 salle de calcul, pour toujours.', 'server');
    } else if (k === 'rent') {
      S.rented++; unlock(S, 'puces');
      add('Salle louée', '+1 salle de calcul, cette année seulement.', 'clock');
    } else if (k.startsWith('hire')) {
      const f = k.slice(4);
      S[f]++;
      const nm = { R: 'Recherche', E: 'Ingénierie', S: 'Sécurité' }[f];
      if (f === 'S') unlock(S, 'alignement');
      add(nm + ' : nouvelle recrue', f === 'R' ? 'Le dé de recherche s’améliore.' : f === 'E' ? 'Vos produits et vos modèles avancent mieux.' : 'Les tests rapportent plus et les incidents baissent.', f === 'R' ? 'flask' : f === 'E' ? 'gear' : 'shield');
    } else if (k === 'mkt') {
      const wasOpen = S.diff === 'open';
      S.price = p.price; S.diff = p.diff;
      unlock(S, 'freemium');
      if (p.diff === 'open' && !wasOpen) {
        unlock(S, 'ouverts');
        if (it.opp === 'open') S.yr.openUsage = 1.3;
        if (S.seals >= 2) { S.conf = clamp(S.conf + 1, 0, 5); add('Poids ouverts', 'Votre modèle est publié. Bien testé, il inspire confiance : +1.', 'unlock'); }
        else add('Poids ouverts', 'Votre modèle est publié. Non testé, il inquiète une partie du public.', 'unlock', 'neg');
      } else add('Prix : ' + PRICES.find(x => x.id === p.price).name, 'Nouvelle offre sur le marché.', 'coin');
    } else if (k.startsWith('prod:')) {
      const id = k.slice(5);
      S.products[id] = true;
      if (id === 'voice') unlock(S, 'latence');
      if (id === 'code') unlock(S, 'code');
      if (id === 'agents') unlock(S, 'agents');
      add(PRODUCTS[id].name + ' en ligne', PRODUCTS[id].desc, PRODUCTS[id].icon);
    } else if (k.startsWith('part:')) {
      const id = k.slice(5), pt = PARTNERS[id];
      S.contracts.push({ id, left: pt.years, age: 0 });
      unlock(S, pt.sav);
      if (id === 'cursor' && it.opp === 'cursor') S.cash += 6;
      add('Contrat ' + pt.name, pt.win[0], 'handshake');
    } else if (k === 'train') {
      
      // recalcul sur l'état réel (les actions précédentes sont appliquées)
      const sz = SIZES[p - 1];
      const miss = {
        data: Math.max(0, sz.data - S.data),
        rooms: Math.max(0, sz.rooms - roomsAll(S)),
        talent: Math.max(0, sz.talent - (S.R + S.E))
      };
      const pen = miss.data + miss.rooms + miss.talent;
      const bonus = Math.min(2, Math.floor(S.R / 2)) + S.yr.dieBonus;
      const roll = d6();
      const totalRoll = roll + bonus - pen;
      const outcome = totalRoll <= 1 ? 'fail' : totalRoll <= 3 ? 'ok' : totalRoll <= 5 ? 'good' : 'great';
      die = { size: p, roll, bonus, pen, miss, total: totalRoll, outcome, cost: it.cost };
      S.yr.trainRooms = Math.min(sz.rooms, Math.max(0, roomsAll(S) - 1));
      unlock(S, 'params'); unlock(S, 'echelle');
      if (outcome === 'fail') {
        S.yr.trained = { size: p, outcome };
        add('Entraînement raté', 'Le modèle ' + sz.name + ' n’a pas convergé. L’argent est perdu.', 'hex', 'neg');
      } else {
        const q = { ok: 0, good: 1, great: 2 }[outcome];
        if (p > S.tier) { S.tier = p; S.quality = q; S.seals = 0; S.bonusP = 0; S.collapsed = false; S.synthUses = Math.min(S.synthUses, 2); }
        else S.quality = Math.max(S.quality, q);
        S.products.chat = true;
        S.yr.trained = { size: p, outcome };
        add('Modèle ' + sz.name + ' entraîné', { ok: 'Résultat correct.', good: 'Bon résultat.', great: 'Percée : le modèle dépasse les attentes.' }[outcome], 'hex');
      }
    } else if (k === 'test') {
      const g = S.S >= 2 ? 2 : 1;
      S.seals = Math.min(SEAL_MAX, S.seals + g);
      unlock(S, 'eval');
      add('Tests de sécurité', '+' + g + ' sceau' + (g > 1 ? 'x' : '') + ' pour le modèle ' + modelName(S) + '.', 'shield');
    }
  });
  S.plan = [];
  S.acts = acts;
  S.die = die;
  return { acts, die };
}

/* ---------- Fin d'année ---------- */
function fixedCosts(S) {
  const sal = (S.R + S.E + S.S) * 2;
  const up = S.rooms * 3 * (S.energy ? 1.5 : 1);
  const partner = hasContract(S, 'robots') ? 5 : 0;
  return { sal, up, partner, total: sal + up + partner };
}

const fmt = (n, d = 1) => (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d).replace('.', ',').replace(/,0+$/, '');
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));

const PRICE_WHY = {
  pay: 'Peu de monde, mais chaque personne rapporte beaucoup.',
  free: 'Beaucoup d’essais gratuits, peu de personnes qui paient.',
  tiers: 'Un bon équilibre entre audience et revenus.',
  meter: 'Les entreprises paient au plus juste, les curieux restent à l’écart.',
  gratuit: 'Tout le monde vient, mais rien ne rentre.'
};

function endYear(S) {
  const before = { cash: S.cash, P: power(S), conf: S.conf, U: S.users };
  const pr = priceOf(S), open = S.diff === 'open';
  const P = power(S);
  const lines = [];

  // Croissance
  let newU = 0;
  if (S.tier > 0) {
    const prodMult = 1 + PROD_ORDER.filter(x => S.products[x]).reduce((a, x) => a + PRODUCTS[x].usage, 0);
    newU = (0.5 + 0.55 * P) * (pr.usage / 3) * prodMult * (open ? 1.8 * S.yr.openUsage : 1)
      * (0.4 + 0.12 * S.conf) * S.yr.growth * (0.88 + 0.24 * rnd()) * Math.max(0.15, 1 - S.users / 40);
    if (hasContract(S, 'cursor')) newU += 0.8;
  }
  let U1 = S.users * 0.88 + newU;

  // Charge de calcul
  const prodLoad = PROD_ORDER.filter(x => S.products[x]).reduce((a, x) => a + PRODUCTS[x].load, 0);
  const load = S.tier > 0 ? U1 * (0.5 + 0.1 * pr.charge) + prodLoad + S.yr.extraLoad : 0;
  const cap = Math.max(0, roomsAll(S) - S.yr.trainRooms) * 4;
  const sat = S.tier > 0 && load > cap + 0.001;
  if (sat) U1 *= 0.92;

  // Recettes
  const msShare = hasContract(S, 'ms') ? 0.85 : 1;
  let rev = U1 * pr.rev * 2.2 * (open ? 0.35 : 1) * S.yr.rev * (sat ? 0.8 : 1) * msShare;
  const flat = PROD_ORDER.filter(x => S.products[x]).reduce((a, x) => a + PRODUCTS[x].flat, 0) * Math.min(1, U1 / 2) * (sat ? 0.8 : 1);
  rev += flat;
  if (hasContract(S, 'cursor')) rev += 5;
  if (hasContract(S, 'ms')) rev += 6;
  if (hasContract(S, 'sante')) rev += 4;
  if (hasContract(S, 'auto')) rev += 14;

  // Charges
  const fc = fixedCosts(S);
  const serve = load * 0.9;
  const costs = fc.total + serve;

  // Incident
  let p = 0;
  if (S.tier > 0 && U1 > 0.3) {
    const prodRisk = PROD_ORDER.filter(x => S.products[x]).reduce((a, x) => a + PRODUCTS[x].risk, 0);
    p = clamp(0.08 + 0.09 * Math.max(0, S.tier - S.seals) + (open ? 0.1 : 0) + prodRisk - 0.03 * S.S, 0.03, 0.75);
  }
  const incident = p > 0 && rnd() < p;

  // Confiance
  let dc = 0, dcI = 0, dcS = 0, brokeSante = false;
  if (incident) {
    dcI -= S.tier >= 3 ? 2 : 1;
    if (hasContract(S, 'sante')) { dcI -= 2; brokeSante = true; }
    if (hasContract(S, 'auto')) dcI -= 2;
  }
  if (sat) { dcS -= 1; if (hasContract(S, 'cursor')) dcS -= 1; }
  if (S.tier > 0 && !incident && !sat && S.seals >= Math.min(S.tier, 3)) dcI += 1;
  const sc = S.contracts.find(c => c.id === 'sante');
  if (sc && sc.age < 2 && !brokeSante) dcI += 1;
  dc = dcI + dcS;

  // Application
  S.users = Math.round(U1 * 1000) / 1000;
  S.cash = S.cash + rev - costs;
  S.conf = clamp(S.conf + dc, 0, 5);

  // Contrats : données, échéances
  const endNotes = [];
  S.contracts.forEach(c => {
    if (c.id === 'robots' || c.id === 'auto') S.data = Math.min(DATA_MAX, S.data + 1);
    c.left--; c.age++;
    if (c.left <= 0 || (c.id === 'sante' && brokeSante)) {
      c.done = true;
      if (c.id === 'robots' && c.left <= 0) { S.bonusP = Math.min(2, S.bonusP + 1); endNotes.push('Fin du contrat Robots : votre modèle progresse de 1.'); }
      else endNotes.push(brokeSante && c.id === 'sante' ? 'Le contrat de recherche médicale est rompu.' : 'Le contrat ' + PARTNERS[c.id].name + ' se termine.');
    }
  });
  S.contracts = S.contracts.filter(c => !c.done);
  S.energy = 0;

  const after = { cash: S.cash, P: power(S), conf: S.conf, U: S.users };
  const d = { cash: after.cash - before.cash, P: after.P - before.P, conf: after.conf - before.conf, U: after.U - before.U };
  const pw = pawns(S);

  // Récapitulatif : cause → effet
  const tr = S.yr.trained;
  if (tr) {
    const sz = SIZES[tr.size - 1];
    lines.push({
      from: 'Entraînement du modèle ' + sz.name + (S.die ? ' (dé ' + S.die.roll + (S.die.total !== S.die.roll ? ', total ' + S.die.total : '') + ')' : ''),
      to: tr.outcome === 'fail' ? 'Le dé a donné « Raté » : le modèle n’a pas convergé.' : tr.outcome === 'great' ? 'Percée : le modèle est nettement plus capable.' : tr.outcome === 'good' ? 'Le dé a donné « Bon » : le modèle est plus capable.' : 'Le dé a donné « Correct » : le modèle est fonctionnel.',
      stat: d.P ? 'Puissance ' + (d.P > 0 ? '+' : '−') + Math.abs(d.P) : 'Puissance =', tone: tr.outcome === 'fail' ? 'neg' : 'pos'
    });
  }
  if (S.tier === 0) {
    lines.push({ from: 'Aucun modèle en service', to: 'Sans modèle, personne ne vous utilise. Entraînez-en un.', stat: 'Usage =', tone: 'neg' });
  } else {
    lines.push({
      from: 'Prix ' + pr.name + (open ? ' · poids ouverts' : ''),
      to: PRICE_WHY[pr.id] + (open ? ' Les poids ouverts attirent la communauté, mais on ne vous paie plus l’accès.' : ''),
      stat: 'Usage ' + (d.U >= 0 ? '+' : '−') + fmt(Math.abs(d.U)) + ' M', tone: d.U >= 0 ? 'pos' : 'neg'
    });
  }
  if (S.tier > 0) {
    lines.push({
      from: S.yr.trainRooms ? 'Entraînement : ' + S.yr.trainRooms + ' salle' + (S.yr.trainRooms > 1 ? 's' : '') + ' occupée' + (S.yr.trainRooms > 1 ? 's' : '') + ' · charge ' + fmt(load, 0) + ' pour ' + fmt(cap, 0) : 'Charge ' + fmt(load, 0) + ' pour ' + fmt(cap, 0) + ' de capacité',
      to: sat ? 'Serveurs saturés : une partie du public repart et les revenus baissent.' : load > cap * 0.8 ? 'Les serveurs tiennent, mais de justesse.' : 'Les serveurs tiennent sans effort.',
      stat: dcS ? 'Confiance −' + Math.abs(dcS) : 'Confiance =', tone: sat ? 'neg' : 'pos'
    });
    lines.push({
      from: 'Risque d’incident ' + Math.round(p * 100) + ' % · ' + S.seals + ' sceau' + (S.seals > 1 ? 'x' : '') + ' sur ' + Math.min(S.tier, 3),
      to: incident ? (brokeSante ? 'Un incident grave : le contrat médical est rompu.' : 'Quelqu’un a détourné votre modèle.') : (S.seals >= Math.min(S.tier, 3) ? 'Aucun incident : le public vous fait confiance.' : 'Aucun incident cette fois, mais le risque reste élevé.'),
      stat: dcI ? 'Confiance ' + (dcI > 0 ? '+' : '−') + Math.abs(dcI) : 'Confiance =', tone: incident ? 'neg' : 'pos', extra: true
    });
  }
  lines.push({
    from: 'Recettes ' + fmt(rev, 0) + ' M$ · charges ' + fmt(costs, 0) + ' M$',
    to: 'Salaires ' + fmt(fc.sal, 0) + ', salles ' + fmt(fc.up, 0) + ', réponses au public ' + fmt(serve, 0) + (fc.partner ? ', terrain ' + fc.partner : '') + '.',
    stat: 'Argent ' + (d.cash >= 0 ? '+' : '−') + fmt(Math.abs(d.cash), 0) + ' M$', tone: d.cash >= 0 ? 'pos' : 'neg'
  });
  endNotes.forEach(t => lines.push({ from: 'Contrats', to: t, stat: '', tone: 'pos' }));

  unlock(S, 'inference');
  S.history.push({ year: S.year, ...pw });

  const rec = {
    year: S.year, lines, before: { puis: before.P, conf: before.conf * 2, usage: Math.min(10, before.U / 2.5) }, after: pw,
    d, rev, costs, sat, incident, p, load, cap
  };
  S.recap = rec;

  // Fin de partie ?
  if (S.cash < 0) S.over = 'bankrupt';
  else if (S.year >= 5 && pw.puis >= SEUIL && pw.conf >= SEUIL && pw.usage >= SEUIL) S.over = 'win';
  else if (S.year >= MAXY) S.over = 'end';
  return rec;
}

function nextYear(S) {
  S.year++;
  S.yr = newYr();
  S.plan = [];
  S.acts = []; S.die = null; S.recap = null;
  if ((S.year === 4 || S.year === 7) && S.teams < 6) S.teams++;
  drawHand(S);
  S.ev = drawEvent(S);
}

const evById = id => EVENTS.find(e => e.id === id);

function drawEvent(S) {
  const ok = EVENTS.filter(e => !S.usedEvents.includes(e.id) && e.cond(S));
  if (!ok.length) return null;
  const e = ok[Math.floor(rnd() * ok.length)];
  return { id: e.id, done: false, choice: null, result: '', roll: null };
}

function chooseEvent(S, which) {
  const e = evById(S.ev.id), c = e[which];
  if (c.cost && S.cash < c.cost) return false;
  const roll = c.die ? d6() : null;
  S.ev.result = c.run(S, roll);
  S.ev.roll = roll;
  S.ev.choice = which;
  S.ev.done = true;
  S.usedEvents.push(e.id);
  if (e.sav) unlock(S, e.sav);
  return true;
}

function hudHTML(phase) {

  return `<div class="paper hud">

    </div></div>`;
}

function trackHTML(pw, ghostFrom) {
  const pos = v => (clamp(v, 0, 10) * 10) + '%';
  const defs = [['puis', 'var(--blu)', 4, 'Puissance'], ['conf', 'var(--grn)', 12, 'Confiance'], ['usage', 'var(--pin)', 20, 'Usage']];
  let pw2 = '';
  defs.forEach(([k, c, top]) => {
    if (ghostFrom) pw2 += `<span class="ghost" style="left:${pos(ghostFrom[k])};top:${top + 1}px;color:${c}"></span>`;
    pw2 += `<span class="pawn" data-k="${k}" data-to="${pos(pw[k])}" style="left:${ghostFrom ? pos(ghostFrom[k]) : pos(pw[k])};top:${top}px;background:${c}"></span>`;
  });
  return `<div class="track"><div class="trackkey"><span>Vers le Seuil</span><span>Les trois pions au drapeau</span></div>
    <div class="lane" style="margin:0 12px"><div class="rail"></div><div class="flag" style="left:${pos(SEUIL)}"></div>${pw2}</div>
    <div class="trackkey"><span><i style="background:var(--blu)"></i>Puissance</span><span><i style="background:var(--grn)"></i>Confiance</span><span><i style="background:var(--pin)"></i>Usage</span></div></div>`;
}

function spotHTML(k, o) {
  const it = planned(S, k);
  const on = !!it;
  const lock = o.lock && !on;
  const cost = on ? it.cost : (o.cost ?? costOf(S, k, o.p));
  const co = o.noCost ? '' : (cost === 0 ? '<span class="co fr">gratuit</span>' : `<span class="co">${fmt(cost, 0)} M$</span>`);
  return `<button class="spot ${on ? 'on' : ''} ${lock ? 'lock' : ''}" data-a="${o.act || 'spot'}" data-v="${o.v || k}" aria-pressed="${on}" aria-label="${o.name}${on ? ', équipe posée' : ''}">
    <span class="ring">${on ? meeple('#9d8cff', 30, 'mp') : ico(o.icon, 28, o.col || '#fff')}</span>
    <span class="nm">${o.name}${o.sub ? `<br><span style="font-weight:400;font-size:11px">${o.sub}</span>` : ''}</span>${co}</button>`;
}

function zoneHTML(name, col, right, body) {
  return `<section class="paper zone"><header class="dots" style="background-color:${col}"><b>${name}</b><span>${right}</span></header><div class="body">${body}</div></section>`;
}

function boardScreen() {

  // Marché
  const mk = S.plan.find(x => x.k === 'mkt');
  const pdOn = PROD_ORDER.filter(x => S.products[x] && x !== 'chat').map(x => PRODUCTS[x].name);
  const pdPlan = S.plan.filter(x => x.k.startsWith('prod:')).map(x => PRODUCTS[x.k.slice(5)].name);
  const ptPlan = S.plan.filter(x => x.k.startsWith('part:')).map(x => PARTNERS[x.k.slice(5)].name);
  const tm = (cond) => cond ? `<span class="tm">${meeple('#9d8cff', 18, 'mp')}</span>` : '';
  const pr = mk ? PRICES.find(x => x.id === mk.p.price) : priceOf(S);

    `<div class="tiles">
      <button class="tile" data-a="go" data-v="market">${tm(mk)}<span class="cap">Prix</span><b>${pr.name}</b></button>

      <button class="btn" data-a="launch">${S.plan.length ? 'Lancer l’année' : 'Passer l’année'}</button>
    </div>`;

/* ---------- Atelier ---------- */
function fixChoice(ti) {
  const m = ti.miss;
  if (m.data > 0) {
    const k = !planned(S, 'lic') ? 'lic' : !planned(S, 'web') ? 'web' : 'syn';
    return { k, label: { lic: 'Prendre des licences', web: 'Puiser dans le web libre', syn: 'Données synthétiques' }[k] };
  }
  if (m.rooms > 0) return { k: !planned(S, 'build') ? 'build' : 'rent', label: !planned(S, 'build') ? 'Construire une salle' : 'Louer une salle' };
  if (m.talent > 0) {
    const k = !planned(S, 'hireR') && ti.q.R <= ti.q.E ? 'hireR' : !planned(S, 'hireE') ? 'hireE' : 'hireR';
    return { k, label: k === 'hireR' ? 'Recruter en recherche' : 'Recruter en ingénierie' };
  }
  return null;
}

  const fixBtn = fx ? `<button class="btn" data-a="fix" data-v="${fx.k}">${fx.label}<small>${fmt(costOf(S, fx.k), 0)} M$ · 1 équipe</small></button>` : `<button class="btn sec" data-a="go" data-v="board">Retour au plateau<small>tout est prêt</small></button>`;

  <div class="foot"><div class="grid2">${fixBtn}${trainBtn}</div></div>`;
